server:
  port: 8081

spring:
  application:
    name: order
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.eda.common.event
  datasource:
    url: jdbc:postgresql://localhost:5432/eda
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: order
        globally_quoted_identifiers: true   # order 등 예약어 식별자를 큰따옴표로 감쌈
        hbm2ddl:
          create_namespaces: true            # 스키마가 없으면 생성
server:
  port: 8081

spring:
  application:
    name: order
  kafka:
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=orders
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: orders
        hbm2ddl:
          create_namespaces: true            # 스키마가 없으면 생성

stock:
  client:
    base-url: http://${STOCK_HOST:localhost}:8084
    connect-timeout: 300ms
    read-timeout: 1500ms     # stock 이 Redis 를 기다리는 500ms(최악 두 번)보다 길게 둬, stock 이 먼저 실패를 알리게 한다
  restore:
    pool-size: 8
    queue-capacity: 200
    retry:
      max-retries: 5
      delay: 1s
      multiplier: 2
      max-delay: 16s
      jitter: 200ms

services:
  postgres:
    image: postgres:17-alpine
    container_name: eda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: eda
      POSTGRES_DB: eda
    volumes:
      - eda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:9.0-alpine
    container_name: eda-redis
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: eda-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: 컨테이너끼리, EXTERNAL: 호스트에서 접속
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 168
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eda-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

  order:
    image: eda-order:latest
    pull_policy: never
    container_name: eda-order
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  payment:
    image: eda-payment:latest
    pull_policy: never
    container_name: eda-payment
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  product:
    image: eda-product:latest
    pull_policy: never
    container_name: eda-product
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  stock:
    image: eda-stock:latest
    pull_policy: never
    container_name: eda-stock
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  notification:
    image: eda-notification:latest
    pull_policy: never
    container_name: eda-notification
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped

volumes:
  eda-postgres-data:

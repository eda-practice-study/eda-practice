server:
  port: 8083

spring:
  application:
    name: product
  datasource:
    url: jdbc:postgresql://localhost:5432/eda
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: product
        globally_quoted_identifiers: true
        hbm2ddl:
          create_namespaces: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # outbox 의 payload 는 이미 JSON 문자열이라 그대로 내보낸다.
      # 저장된 값과 발행된 값이 같아지고, 릴레이가 이벤트 타입을 알 필요도 없다.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

outbox:
  relay:
    fixed-delay: 1000   # 폴링 주기(ms). 이 값만큼 발행이 지연될 수 있다

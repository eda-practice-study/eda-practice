server:
  port: 8084

spring:
  application:
    name: stock
  kafka:
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=stock
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: stock
        hbm2ddl:
          create_namespaces: true

stock:
  reconcile:
    enabled: true
    interval: 60s   # 대사 주기
    grace: 10s      # 이 시간 안에 바뀐 재고는 대사에서 건너뛴다
  reservation:
    expire-enabled: true
    expire-interval: 30s  # 만료 예약 확인 주기
    timeout: 10m          # 이 시간 넘게 확정 · 취소되지 않은 예약은 자동 취소
    record-ttl: 1d        # 확정 · 취소된 예약 기록 보관 시간 (늦게 도착한 Try 차단용)

server:
  port: 8084

spring:
  application:
    name: stock
  data:
    redis:
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=stock
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: stock
        hbm2ddl:
          create_namespaces: true

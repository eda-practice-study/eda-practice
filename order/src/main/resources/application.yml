server:
  port: 8081

spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=orders
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: orders
        hbm2ddl:
          create_namespaces: true            # 스키마가 없으면 생성

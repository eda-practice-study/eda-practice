server:
  port: 8084

spring:
  application:
    name: stock
  kafka:
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=stock
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: stock
        hbm2ddl:
          create_namespaces: true

stock:
  order-record:
    ttl: 1h            # 주문 키별 차감 기록과 취소 표시. order 의 restore 재시도가 모두 끝나는 시간보다 길어야 한다

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    consumer:
      auto-offset-reset: earliest

stock:
  client:
    base-url: http://localhost:8084
    connect-timeout: 300ms
    read-timeout: 1500ms

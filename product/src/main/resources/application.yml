server:
  port: 8083

spring:
  application:
    name: product
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/eda?currentSchema=product
    username: eda
    password: eda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: product
        hbm2ddl:
          create_namespaces: true

services:
  postgres:
    image: postgres:17-alpine
    container_name: eda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: eda
      POSTGRES_DB: eda
    volumes:
      - eda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: eda-kafka
    ports:
      - "9092:9092"
    environment:
      # 단일 브로커
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: 도커 네트워크 내부(컨테이너 간), EXTERNAL: 호스트에서 접속
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eda-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  order:
    build:
      context: .
      dockerfile: order/Dockerfile
    container_name: eda-order
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/eda"
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  stock:
    build:
      context: .
      dockerfile: stock/Dockerfile
    container_name: eda-stock
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/eda"
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  product:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: eda-product
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/eda"
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 이벤트 전용(웹 없음) → 포트/restart 없음 (리스너 붙으면 상주)
  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: eda-payment
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/eda"
      SPRING_DATASOURCE_USERNAME: eda
      SPRING_DATASOURCE_PASSWORD: eda
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  eda-postgres-data:
